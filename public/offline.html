<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6A6A53" />
    <title>Offline · Pioniersplanner</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        font-family: system-ui, sans-serif;
        background: #ede7db;
        color: #4d342d;
      }
      main {
        max-width: 28rem;
      }
      p.label {
        letter-spacing: 0.2em;
        text-transform: uppercase;
        font-size: 0.7rem;
        margin: 0 0 1rem;
        color: #6a6a53;
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2.4rem;
        line-height: 1.1;
        margin: 0 0 0.8rem;
        font-weight: 600;
      }
      p {
        line-height: 1.5;
        color: #6a6a53;
      }
      button {
        margin-top: 1.2rem;
        border: 0;
        border-radius: 0.8rem;
        padding: 0.75rem 1.2rem;
        background: #6a6a53;
        color: #ede7db;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="label">Pioniersplanner</p>
      <h1>Je bent offline.</h1>
      <p>
        De app is lokaal beschikbaar na de eerste keer laden. Zodra je weer verbinding hebt, kun je
        verder plannen.
      </p>
      <button type="button" onclick="location.reload()">Opnieuw proberen</button>
    </main>
  </body>
</html>
