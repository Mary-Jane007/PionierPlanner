# Render Blueprint: Pioniersplanner is a static Next.js export (`output: "export"`).
# Do not use Render's native Next.js runtime / `next start`.
services:
  - type: web
    name: pioniersplanner
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
