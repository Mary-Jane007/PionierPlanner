# Render Blueprint: Node web service serves the static export plus /api/cloud.
# Set DATABASE_URL (Neon Postgres) and AUTH_SECRET in the Render dashboard.
services:
  - type: web
    name: pionierplanner
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
